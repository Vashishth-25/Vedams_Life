<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer page</title>
</head>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f8f8f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; 
    }
    
    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
    }
    
    label {
        display: block;
        margin-bottom: 10px;
    }
    
    input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    
    button {
        background-color: #4caf50;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    
    button:hover {
        background-color: #45a049;
    }
    #music{
        z-index: -1;
    }
</style>
<body>
    <audio id="music" autoplay loop>
        <source src="static\bgm1.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    
    <form action="{{ url_for('play_video_3') }}" method="post">

        <label for="input_value">What Are The Roots Of This Quadratic Equation: x^2 - x - 6</label>
        <input type="text" id="input_value" name="input_value" required>
        <button type="submit">Submit answer</button>
    </form>
</script>
</body>
</html>
