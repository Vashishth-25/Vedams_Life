<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='lvl_1.css') }}">
    <title>Level 4: Blood Relations</title>
</head>
<style>
    #backgroundAfterVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('/static/lvl4_bg.png');
  z-index: -2;
  background-size: cover;
  background-position: center;
  min-height: 105vh;
}
  #imageContainer {
  position: fixed;
  top: 70%;
  left: 65%;
  transform: translate(-50%, -50%);
  z-index: -1;
  
}

#clickableImage {
  width: 70%; /* Adjust the width as needed */
  height: auto; /* Maintain aspect ratio */
  cursor: pointer;
}

</style>

<video id="myVideo" width="" height="360" controlsList="nodownload" disablePictureInPicture >
    <source src="{{ url_for('static', filename='vids/lvl4_main.mp4') }}" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div id="imageContainer">
    <img id="clickableImage" src="static\lvl1_button.png" alt="Clickable Image" onclick="redirectToThirdVideo()">
</div>

<div id="backgroundAfterVideo"></div>

<script>
    var video = document.getElementById("myVideo");
    var content = document.querySelector(".content");
    video.autoplay = true;
    video.style.position = "fixed";
    video.style.width = "100%";
    video.style.height = "auto";
    video.style.objectFit = "contain";

    video.play();
    
    setTimeout(function() {
        video.style.display = "none";
        content.style.zIndex = "1"; 
    }, 19500); 


    video.addEventListener('ended', function() {
        backgroundAfterVideo.style.display = "block";
        imageContainer.style.display = "block";
    });
    function redirectToThirdVideo() {
            // Redirect to the third video
            window.location.href = "{{ url_for('lvl4_lec') }}";
    }
</script>

</body>
</html>
