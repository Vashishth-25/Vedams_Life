<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f4f4f4;
            font-family: 'Arial', sans-serif;
            display: flex;
            background-color: rgb(47, 44, 44); 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        button {
            background-color: #4CAF50;
            color: #fff;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <button onclick="tryAgain()">Try Again</button>
    <button onclick="learn()">Learn Again</button>
    <button onclick="mainMenu()">Main Menu</button>

    <script>
        function tryAgain() {
            window.location.href = '/lvl1_ques';
        }

        function learn() {
            window.location.href = '/lvl1_lec';
        }
        function mainMenu() {
            window.location.href = '/levels'
        }
    </script>

</body>
</html>
