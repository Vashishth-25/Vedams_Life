<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video answer</title>
</head>
<body style="margin: 0; overflow: hidden;">
    <video id="videoPlayer" width="100%" height="100%" autoplay>
        <source id="videoSource" src="{{ url_for('static', filename=video_path) }}" type="video/mp4">
    </video>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        videoPlayer.style.bottom = "0"
        videoPlayer.addEventListener('ended', function() {
            window.location.href = '/retry3';
        });
    </script>
</body>
</html>
